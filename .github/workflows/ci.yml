name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Syntax & Hygiene Checks
        run: npm test

      - name: Compile Distributions & Extension Package
        run: npm run build

      - name: Verify Git Working Tree Cleanliness
        run: git diff --exit-code -- . ':!dist/*.zip'

      - name: Verify Extension Package Archive Integrity
        run: unzip -t dist/civitai-theater-extension.zip
